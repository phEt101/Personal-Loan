services:
  nginx:
    image: nginx:1.27-alpine
    container_name: personal-loan-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-loan-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - default
      - shared_database

volumes:
  vendor_data:

networks:
  shared_database:
    external: true
    name: shared-database
